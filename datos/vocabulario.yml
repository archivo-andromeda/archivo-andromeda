# ─────────────────────────────────────────────────────────────
#  Vocabulario controlado de etiquetas
#
#  Cada etiqueta tiene:
#    descripcion: texto breve que aparece en la página "Vocabulario"
#    alias: otras formas de escribirla que se convierten automáticamente
#           en esta etiqueta (útil cuando llegan propuestas del formulario)
#
#  Si una obra usa una etiqueta que no está aquí, el sitio igual la
#  muestra, pero el registro de construcción avisa para que decidas
#  si la agregas al vocabulario o la corriges en obras.csv.
# ─────────────────────────────────────────────────────────────

formatos:
  novela:
    descripcion: "Narración media o larga que cuenta una historia."
  novela corta:
    descripcion: "Narración breve, llamada también «novelle»."
    alias: [nouvelle, novelle, novela breve]
  libro de cuentos:
    descripcion: "Colección de varios relatos de una misma autoría."
    alias: [cuentos, relatos, libro de relatos, colección de cuentos, coleccion de cuentos]
  antología:
    descripcion: "Libro que agrupa textos de varias autorías."
    alias: [antologia, compilación, compilacion]
  cuento:
    descripcion: "Un relato suelto. Puedes ser en un libro, una revista o en una página web como un blog."
    alias: [relato, cuento suelto]
  microficción:
    descripcion: "Un relato muy breve. Con máximo un par de cientos de palabras."
    alias: [microficcion, micro ficción, microrrelato, minificción, minificcion, microcuento]
  poemario narrativo:
    descripcion: "Poesía que construye un mundo o una historia."
    alias: [poemario, poesía narrativa]
  formato mixto:
    descripcion: "Un libro que incluya textos narrativos y otros de no ficción como ensayos o crónicas"
    alias: [formato híbrido, híbrido, hibrido, mixto]

# Medio: dónde o cómo se publicó la obra.
# Los que llevan «en_linea: true» hacen que, al importar una propuesta,
# el enlace «Dónde conseguirla o leerla» se guarde como lectura en línea.
medios:
  editorial:
    descripcion: "Publicada por una editorial, tradicional o independiente."
    alias: [libro, editorial independiente]
  autopublicación:
    descripcion: "Publicada por su propia autoría, en papel o digital."
    alias: [autopublicacion, autoedición, autoedicion, autopublicado]
  editorial cartonera:
    descripcion: "Libros artesanales con tapas de cartón reciclado, una tradición latinoamericana."
    alias: [cartonera]
  fanzine:
    descripcion: "Publicaciones autogestionadas, de tiraje corto y circulación de mano en mano."
    alias: [zine, fanzines]
  plaquette:
    descripcion: "Cuadernillo breve, a menudo de edición artesanal."
    alias: [plaqueta, cuadernillo]
  revista impresa:
    descripcion: "Revista o publicación periódica en papel."
    alias: [revista]
  revista en línea:
    descripcion: "Revista o publicación periódica digital."
    alias: [revista en linea, revista digital, revista web]
    en_linea: true
  blog o web personal:
    descripcion: "Publicada en un blog o una web propia."
    alias: [blog o sitio personal, blog, sitio personal, sitio web, web personal]
    en_linea: true
  redes sociales:
    descripcion: "Publicada en redes, por ejemplo como hilo o serie de posts."
    alias: [red social, hilo, instagram, twitter, bluesky, tumblr]
    en_linea: true

subgeneros:
  ciencia ficción:
    descripcion: "Relatos que imaginen usando herramientas racionales: futuros, tecnologías, ciencias y otros mundos posibles."
    alias: [cf, cifi, ci-fi, sci-fi, scifi, ciencia ficcion, cf-varios]
  weird:
    descripcion: "Lo raro: mezcla lo fantástico, lo horroroso y lo inclasificable."
    alias: [new weird, raro, lo raro]
  distopía:
    descripcion: "Escritos que imaginen sociedades rotas o autoritarias, a modo de advertencia."
    alias: [distopia, distópica]
  utopía:
    descripcion: "Textos que ilustren mundos mejores o deseables."
    alias: [utopia, utópica]
  gótico:
    descripcion: "Narraciones con atmósferas cargadas de suspenso, encierro, secretos y terror."
    alias: [gotico, gótica]
  ucronía:
    descripcion: "Historias alternativas: ¿qué hubiera pasado si…?"
    alias: [ucronia]
  fantasía:
    descripcion: "Narraciones que incluyen lo imposible, la magia o lo maravilloso."
    alias: [fantasia, fantástico, fantastico, fantasía animal]
  horror:
    descripcion: "Narrativas centradas en el terror, lo perturbador y lo monstruoso."
    alias: [terror]
  ficción climática:
    descripcion: "Historias centradas en la crisis climática y ecológica."
    alias: [cli-fi, clifi, ficcion climatica, ecoficción]
  postapocalíptico:
    descripcion: "Narraciones que cuentan lo sucedido despues del fin del mundo (o de un mundo)."
    alias: [postapocaliptico, post-apocalíptico, postapocalipsis]
  poesía especulativa:
    descripcion: "Poesía que trabaja con imaginarios especulativos."
    alias: [cifi-poesia, poesia especulativa, cf-poesía]
  realismo mágico:
    descripcion: "Lo extraordinario aparece en la vida cotidiana como algo natural, sin que nadie se sorprenda."
    alias: [realismo magico]

disidencias:
  lésbica:
    descripcion: "Deseos, relaciones e identidades lésbicas y sáficas."
    alias: [lesbica, lesbiana, sáfica, safica]
  gay:
    descripcion: "Deseos, relaciones e identidades gays."
    alias: [homosexual]
  bisexual:
    descripcion: "Deseos e identidades bisexuales y pansexuales."
    alias: [bi, pansexual, omnisexual, polisexual]
  trans:
    descripcion: "Experiencias, corporalidades e identidades trans."
    alias: [transgénero, transmasculino, transfemenino, trans*, transexual]
  travesti:
    descripcion: "Identidad y política travesti."
    alias: [trava, travo]
  marica:
    descripcion: "Identidades y política marica. También cola, fleto, invertido, etc."
    alias: [maricón, marikón, cola, fleto, marika]
  no binarie:
    descripcion: "Identidades y corporalidades que resisten el binario de género."
    alias: [no binario, no-binarie, nb, enby, enebé, nobi]
  género fluido:
    descripcion: "Identidades o corporalides cuyo género cambia o fluye constantemente."
    alias: [genero fluido, fluidez de género]
  intersex:
    descripcion: "Experiencias indentidades, corporalidades y comunidades intersex."
    alias: [intersexual]
  asexual:
    descripcion: "Experiencias e identidades asexuales y arrománticas."
    alias: [ace, arromántica, acearo, aro, arro, arromantica]
  poliamor:
    descripcion: "Vínculos no monógamos y familias múltiples."
    alias: [poliamoroso, no monogamia]
  cuir:
    descripcion: "Identidades, relaciones o corporalidades que resisten las categorías fijas del género o la sexualidad."
    alias: [queer, kuir]

# Afectos: lo que la obra le hizo sentir a quien la leyó.
afectos:
  esperanza:
    descripcion: "Permite imaginar, aunque sea brevemente, un mundo más bello."
  agobio:
    descripcion: "Se siente opresión, angustia, una tensión que no se libera."
    alias: [angustia, ansiedad, opresión, tensión]
  calentura:
    descripcion: "Conecta con el deseo, con el calor de la carne."
    alias: [excitación, arrechura, cachondez]
  congoja:
    descripcion: "Tristeza en sus múltiples acentos, desde la lástima hasta las lágrimas con hipo."
    alias: [tristeza, pena, melancolía, lástima]
  ternura:
    descripcion: "Genera una sensación suave y linda. Ganas de acariciar, cuidar o sólo evidenciar la belleza."
    alias: [cariño, kawaii, nanai]
  mariposas:
    descripcion: "Provoca un revoloteo en el estómago. El afecto clave del romance."
    alias: [enamoramiento, flechazo]
  rabia:
    descripcion: "Indigna, enfurece o frustra, incluso dan ganas de repartir golpes."
    alias: [ira, enojo, indignación, bronca, frustración, indignacion]
  asco:
    descripcion: "Te genera rechazo o dan arcadas, incluso hasta dejar de leer."
    alias: [repulsión, repugnancia]
  extrañeza:
    descripcion: "Hay algo que no cuadra, algo raro o indescriptible."
    alias: [extrañamiento, desconcierto, perplejidad]
  curiosidad:
    descripcion: "Dan ganas de explorar y buscar más."
    alias: [intriga]
  risa:
    descripcion: "Algo que hace reír, puede ser sólo una sonrisita o una carcajada frente al libro."
    alias: [humor, carcajada, diversión, gracia]
  hastío:
    descripcion: "Algo que aburre, satura o cansa, se hace díficil seguir leyendo."
    alias: [aburrimiento, tedio, hartazgo]

# Idioma original: la lengua en que se escribió la obra (una edición bilingüe puede llevar dos).
# Para sumar una lengua, agrégala aquí con su descripción y sus otras formas de escribirla.
idiomas:
  español:
    descripcion: "Escrita en español."
    alias: [castellano, espanol]
  portugués:
    descripcion: "Escrita en portugués."
    alias: [portugues]
  francés:
    descripcion: "Escrita en francés."
    alias: [frances]
  mapudungun:
    descripcion: "Escrita en mapudungun, la lengua del pueblo mapuche."
    alias: [mapuzungun, mapudungu, mapuchedungun]
  quechua:
    descripcion: "Escrita en quechua (runasimi)."
    alias: [runasimi, runa simi, quichua]
  aymara:
    descripcion: "Escrita en aymara."
    alias: [aimara]
  guaraní:
    descripcion: "Escrita en guaraní (avañe'ẽ)."
    alias: [guarani, avañe'ẽ, avañee]
  náhuatl:
    descripcion: "Escrita en náhuatl."
    alias: [nahuatl]
  maya:
    descripcion: "Escrita en maya (maaya t'aan)."
    alias: [maya yucateco, maaya t'aan]
  creol haitiano:
    descripcion: "Escrita en creol haitiano (kreyòl ayisyen)."
    alias: [kreyòl, kreyol, kreyòl ayisyen, creole, criollo haitiano, creol]

# Los temas son etiquetas libres: no necesitan estar en el vocabulario.
# Si quieres unificar variantes, agrega aquí un alias.
temas:
  colapso climático:
    alias: [cambio climático, crisis climática]
