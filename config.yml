# ─────────────────────────────────────────────────────────────
#  Configuración del Archivo Andrómeda
#  Edita estos valores directamente; el sitio se reconstruye solo.
# ─────────────────────────────────────────────────────────────

nombre: "Archivo Andrómeda"
lema: "Catálogo comunitario de literatura especulativa LGBTQ+ latinoamericana"

# Dirección pública del sitio, sin barra final (se usa para enlaces al compartir).
# Ejemplo: https://tu-usuaria.github.io/archivo-andromeda
url_sitio: "https://archivoandromeda.cl"

# Enlace al Google Form para proponer obras (el enlace largo o el corto forms.gle/...).
# Mientras esté vacío, la página "Proponer una obra" mostrará un aviso.
formulario_url: "https://forms.gle/vtmChzjUD1wiLhrW7"

# Enlace del botón «Ayúdanos a completarla» de las fichas en revisión y revisadas:
# el mismo formulario, con el título y le autore ya escritos (en Google Forms:
# ⋮ → Get pre-filled link, escribiendo TITULO y AUTORE en esas preguntas).
# El sitio reemplaza TITULO y AUTORE por los datos de cada obra. Vacío = el botón lleva a «Proponer».
completar_url: "https://docs.google.com/forms/d/e/1FAIpQLSehO8xdgGS2G3kYI5wZdNUKjIZEuXukSmdxIRdbrbc_6hMFbw/viewform?usp=pp_url&entry.1092076190=TITULO&entry.1606677064=AUTORE"

# Correo o red de contacto (opcional). Déjalo vacío para no mostrarlo.
contacto: "archivo.andromeda@gmail.com"

# Créditos que aparecen en el pie de página.
creditos: "Curaduría: Marion Garolera"

# Biblioteca aliada: botón «Pedir copia» en las fichas y filtro en el catálogo.
# En obras.csv, la columna «biblioteca» lleva el enlace a la ficha de la obra en su sitio,
# o «sí» si la tienen pero aún no hay ficha (entonces se usa el enlace general «url»).
biblioteca:
  nombre: "Centro RARA"
  filtro: "Biblioteca RARA"
  boton: "Pedir copia en Centro RARA"
  lugar: "Préstamo en Santiago de Chile"
  url: "https://centrorara.cl/"
