name: Importar autores

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Enlace CSV de la pestaña pública de autores (déjalo vacío para usar el guardado en AUTORES_CSV_URL)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Importar respuestas aprobadas
        env:
          URL_INPUT: ${{ inputs.url }}
          URL_GUARDADA: ${{ vars.AUTORES_CSV_URL }}
        run: |
          URL="${URL_INPUT:-$URL_GUARDADA}"
          if [ -z "$URL" ]; then
            echo "::error::Falta el enlace CSV. Pégalo al ejecutar o guárdalo como variable AUTORES_CSV_URL."
            exit 1
          fi
          python scripts/importar_autores.py "$URL"
      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain datos/autores.csv estatico)" ]; then
            echo "No hay cambios en las fichas de autores."
            exit 0
          fi
          git config user.name "archivo-andromeda[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/autores.csv estatico
          git commit -m "Importar fichas de autores aprobadas del formulario"
          git push
